[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfa-backend"
version = "0.0.1"
description = "AI Personal Finance Assistant — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    # ADR-006: API LangGraph đổi nhanh → pin minor.
    "langgraph>=1.2,<1.3",
    # Phase 13: upload multipart + đổi ảnh HEIC/HEIF sang JPEG trước khi gửi model vision.
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pillow-heif>=0.18",
    # Phase 14: đọc sao kê CSV / XLSX.
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    # Phase 13: file expected *.yaml của golden set hoá đơn.
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai" = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Thư mục migration `alembic/` trùng tên package alembic → ép coi là third-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ai'"
markers = [
    "ai: test gọi OpenAI thật (cần OPENAI_API_KEY, chạy bằng `pytest -m ai`)",
]
