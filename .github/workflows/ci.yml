# Phase 18: CI không gọi OpenAI (test `ai` bị loại mặc định, embedding/LLM đều được fake).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pfa
          POSTGRES_PASSWORD: pfa
          POSTGRES_DB: pfa
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pfa -d pfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pfa:pfa@localhost:5433/pfa
      TEST_DATABASE_URL: postgresql+psycopg://pfa:pfa@localhost:5433/pfa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Tạo database test
        run: PGPASSWORD=pfa psql -h localhost -p 5433 -U pfa -d pfa -c "CREATE DATABASE pfa_test OWNER pfa;"
      - name: Cài dependency
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (không gọi AI) + coverage lõi deterministic
        run: pytest --cov=app.services --cov-report=term --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
